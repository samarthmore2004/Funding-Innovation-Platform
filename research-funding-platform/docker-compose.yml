# Full stack: PostgreSQL + FastAPI backend + React frontend (nginx).
#   copy .env.example .env      (then set SECRET_KEY and POSTGRES_PASSWORD)
#   docker compose up --build
# Frontend: http://localhost:8080   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rfip}
      POSTGRES_USER: ${POSTGRES_USER:-rfip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rfip} -d ${POSTGRES_DB:-rfip}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rfip}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-rfip}
      DATA_DIR: /data
      # Docker-specific values (kept separate from the local-dev FRONTEND_URL in .env)
      FRONTEND_URL: ${DOCKER_FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      OAUTH_REDIRECT_BASE_URL: ${DOCKER_OAUTH_REDIRECT_BASE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
